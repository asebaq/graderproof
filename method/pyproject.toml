[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graderproof"
version = "0.1.0"
description = "Adapter-based audit framework for RL-environment graders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Graderproof" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graderproof = "graderproof.cli:main"

[tool.setuptools.packages.find]
include = ["graderproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
